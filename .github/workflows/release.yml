name: Release

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    # Add required reviewers and a v* tag rule to this environment in the
    # repository settings, and set the same environment on the npm trusted
    # publisher, so an OIDC publish needs the environment's approval.
    environment: npm-release
    permissions:
      id-token: write # Required for OIDC
      contents: read # Required for checking out code

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]; then
            echo "::error::Tag ${TAG_NAME} moved after the release was created."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag ${TAG_NAME} does not point at a commit on main."
            exit 1
          fi
          PACKAGE_VERSION=$(jq -r .version package.json)
          if [ "${TAG_NAME}" != "v${PACKAGE_VERSION}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match package.json version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v2
        with:
          experimental: true
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm build

      - name: Verify built binary (e2e)
        run: pnpm test:e2e
        env:
          REVIEWPROMPT_CMD: node dist/index.js

      - name: Publish to npm
        run: pnpm publish --no-git-checks
